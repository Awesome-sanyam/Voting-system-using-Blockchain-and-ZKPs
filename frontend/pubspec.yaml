name: blockvote_india
description: "BlockVote-India: A Decentralized E-Voting Ecosystem using Blockchain and ZKPs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # QR Code
  qr_flutter: ^4.1.0

  # Charts (Admin)
  fl_chart: ^0.70.2

  # Local Storage
  shared_preferences: ^2.3.3

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
